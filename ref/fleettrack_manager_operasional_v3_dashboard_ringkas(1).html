const h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const veh=id=>db.vehicles.find(x=>x.id===id);const drv=id=>db.drivers.find(x=>x.id===id);const trip=id=>db.trips.find(x=>x.id===id);const fmt=n=>Number(n||0).toLocaleString('id-ID');const nt=(s)=>({Baik:'green',Lolos:'green',Selesai:'green',Berlaku:'green',Tersedia:'green',Dikonfirmasi:'green',Berjalan:'blue',Online:'green',Aktif:'red',Kritis:'red','Tidak Layak':'red','Tidak Lolos':'red','Perlu Pemeriksaan':'yellow','Belum Diperiksa':'yellow','Menunggu koordinasi':'yellow','Usulan Admin':'yellow','Offline':'yellow','Terjadwal':'blue','Perlu evaluasi':'yellow','Ditindaklanjuti':'blue'})[s]||'gray';const badge=s=>`<span class="tag ${nt(s)}">${h(s)}</span>`;function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('Penyimpanan browser tidak tersedia')}}function toast(s){document.getElementById('toast-root').innerHTML=`<div class="notice">${h(s)}</div>`;setTimeout(()=>{const el=document.querySelector('.notice');if(el)el.remove()},3300)}
function vBusy(id,ignore){return db.trips.some(t=>t.v===id&&t.id!==ignore&&['Berjalan','Menunggu Pengembalian'].includes(t.stage))}function dBusy(id,ignore){return db.trips.some(t=>t.d===id&&t.id!==ignore&&['Berjalan','Menunggu Pengembalian'].includes(t.stage))}function vReady(v){return v.health==='Baik'&&!v.service&&v.doc&&v.gps==='Online'}function dReady(d){return d.simValid&&d.health==='Berlaku'&&d.rest!=='Jeda kurang'}function dayConflict(date,start,end,arr){return arr.some(t=>t.date===date&&['Terjadwal','Berjalan','Menunggu Pengembalian'].includes(t.stage)&&start<t.end&&end>t.start)}function vAvailable(v){return vReady(v)&&!vBusy(v.id)}
function head(title,subtitle,buttons=''){return `<div class="pagehead"><div><div class="eyebrow">FLEETTRACK / MANAGER OPERASIONAL</div><h1>${title}</h1><div class="muted">${subtitle}</div></div><div class="actions">${buttons}</div></div>`}function panel(title,content,action=''){return `<section class="panel"><div class="panel-head"><h2>${title}</h2>${action}</div>${content}</section>`}function kpi(label,value,note,icon){return `<div class="panel kpi"><div class="ico">${icon}</div><div class="val">${h(value)}</div><div class="lbl">${h(label)}</div><div class="note">${h(note)}</div></div>`}function nav(){document.getElementById('nav').innerHTML=menus.map(g=>`<div class="nav-group"><div class="nav-title">${g[0]}</div>${g[1].map(m=>`<button class="nav ${state.menu===m[0]?'active':''}" onclick="go('${m[0]}')"><i>${m[1]}</i><span>${m[0]}</span></button>`).join('')}</div>`).join('')}function go(m){state.menu=m;state.query='';state.tab[m]=state.tab[m]||'';document.getElementById('sidebar').classList.remove('show');render();window.scrollTo(0,0)}function subtabs(menu,values){let active=state.tab[menu]||values[0];if(!values.includes(active))active=values[0];state.tab[menu]=active;return `<div class="tabs">${values.map(x=>`<button class="tab ${active===x?'sel':''}" onclick="setTab('${menu}','${x}')">${x}</button>`).join('')}</div>`}function setTab(m,t){state.tab[m]=t;render()}
function render(){nav();document.getElementById('breadcrumb').textContent='FleetTrack / Manager / '+state.menu;let html='';switch(state.menu){case'Dashboard Operasional':html=dashboard();break;case'Kalender Operasional':html=calendarPage();break;case'Penugasan & Perjalanan':html=assignments();break;case'Live Tracking':html=tracking();break;case'Riwayat Perjalanan':html=history();break;case'Kesiapan Armada':html=readinessVehicles();break;case'Kesiapan Pengemudi':html=readinessDrivers();break;case'Safety Monitoring':html=safety();break;case'Koordinasi Perawatan':html=maintenance();break;case'Pengajuan Perbaikan Armada':html=repairs();break;case'Laporan Operasional':html=reports();break;}document.getElementById('page').innerHTML=html}
// Kalender Operasional v2: seluruh kalender membaca db.trips dan db.maintenance yang sama.
const isoDay=date=>{let a=new Date(date);return [a.getFullYear(),String(a.getMonth()+1).padStart(2,'0'),String(a.getDate()).padStart(2,'0')].join('-')};
const localDate=iso=>new Date(iso+'T12:00:00');
const addDays=(date,n)=>{let d=localDate(date);d.setDate(d.getDate()+n);return isoDay(d)};
const weekStart=date=>{let d=localDate(date);d.setDate(d.getDate()-(d.getDay()+6)%7);return isoDay(d)};
const prettyDay=date=>localDate(date).toLocaleDateString('id-ID',{day:'numeric',month:'short'});
const prettyLong=date=>localDate(date).toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
const shortWeek=date=>localDate(date).toLocaleDateString('id-ID',{weekday:'short'});
const maintenanceDays=m=>Array.from({length:Math.max(1,Number(m.duration)||1)},(_,i)=>addDays(m.proposal,i));
const calendarMaintenance=()=>db.maintenance.filter(m=>m.status!=='Selesai');
function maintenanceConflict(id,date,start,end){return calendarMaintenance().some(m=>m.v===id&&['Dikonfirmasi','Dalam Perawatan'].includes(m.status)&&maintenanceDays(m).includes(date))}
function calendarEvents(){let trips=db.trips.filter(t=>t.stage!=='Dibatalkan').map(t=>({type:'trip',id:t.id,date:t.date,start:t.start,end:t.end,v:t.v,d:t.d,title:t.destination,status:t.stage}));let service=calendarMaintenance().flatMap(m=>maintenanceDays(m).map(date=>({type:'service',id:m.id,date,start:'08:00',end:'17:00',v:m.v,d:null,title:m.desc,status:m.status})));return [...trips,...service].sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start))}
function calendarConflicts(){let events=calendarEvents(),seen=new Set(),out=[];for(let i=0;i<events.length;i++)for(let j=i+1;j<events.length;j++){let a=events[i],b=events[j];if(a.date!==b.date)continue;if(a.type==='service'&&a.status!=='Dikonfirmasi'&&a.status!=='Dalam Perawatan')continue;if(b.type==='service'&&b.status!=='Dikonfirmasi'&&b.status!=='Dalam Perawatan')continue;if(a.start>=b.end||b.start>=a.end)continue;let vehicle=a.v&&a.v===b.v,driver=a.type==='trip'&&b.type==='trip'&&a.d===b.d;if(vehicle||driver){let key=[a.id,b.id,a.date].join(':');if(!seen.has(key)){seen.add(key);out.push({a,b,date:a.date,reason:[vehicle?'Kendaraan':'',driver?'Pengemudi':''].filter(Boolean).join(' & ')})}}}return out}
function calendarOpen(evType,id){if(evType==='trip')openTrip(id);else maintenanceAction(id)}
function calMove(n){let date=localDate(state.calDate);if(state.calMode==='Bulan')date.setMonth(date.getMonth()+n);else date.setDate(date.getDate()+n*7);state.calDate=isoDay(date);render()}
function calToday(){state.calDate=isoDay(new Date());render()}
function calSetMode(m){state.calMode=m;render()}
function calSetResource(x){state.calResource=x;render()}
function calSetFilter(x){state.calFilter=x;render()}
function calFocus(date){state.calDate=date;state.calMode='Minggu';render()}
function setAgendaPeriod(period){state.agendaPeriod=period;render()}
function setAgendaCategory(category){state.agendaCategory=category;render()}
function jumpTrip(id){go('Penugasan & Perjalanan');openTrip(id)}
function serviceBadge(s){return s==='Dikonfirmasi'||s==='Dalam Perawatan'?'maintenance-confirmed':'maintenance-proposed'}
function agendaWindow(period){let today=isoDay(new Date());let end=period==='today'?addDays(today,1):period==='month'?(()=>{let d=localDate(today);d.setMonth(d.getMonth()+1,1);return isoDay(d)})():addDays(today,7);return {today,end}}
function dashboardAgenda(){
 const period=state.agendaPeriod,category=state.agendaCategory,{today,end}=agendaWindow(period);
 // Penugasan has one canonical source: db.trips. Completed/cancelled trips aren't future agenda.
 const trips=db.trips.filter(t=>!['Selesai','Dibatalkan'].includes(t.stage)&&t.date>=today&&t.date<end).sort((a,b)=>(a.date+' '+a.start).localeCompare(b.date+' '+b.start));
 // Other operational agenda only includes work actually requiring Manager coordination, not routine service schedules.
 const coord=db.maintenance.filter(m=>['Menunggu koordinasi','Usulan Admin'].includes(m.status)&&m.proposal>=today&&m.proposal<end).map(m=>({type:'coord',id:m.id,date:m.proposal,time:'Jadwal usulan',title:'Koordinasi jendela kendaraan',detail:(veh(m.v)?.plate||'-')+' · '+m.desc}));
 const selected=category==='trip'?trips.map(t=>({type:'trip',id:t.id,date:t.date,time:t.start,title:t.destination,detail:(veh(t.v)?.plate||'-')+' · '+(drv(t.d)?.name||'-')+' · '+t.stage})):coord;
 const moreLink=category==='trip'?`<button class='link' onclick="go('Penugasan & Perjalanan')">Lihat seluruh penugasan →</button>`:`<button class='link' onclick="go('Koordinasi Perawatan')">Buka koordinasi perawatan →</button>`;
 const btn=(label,value)=>`<button class="btn small ${category===value?'primary':''}" onclick="setAgendaCategory('${value}')">${label}</button>`;
 return `<section class="panel section"><div class="panel-head"><div><h2>Agenda Mendatang</h2><div class="muted">Lihat penugasan mendatang dan agenda koordinasi yang membutuhkan tindakan</div></div><div class="actions"><select class="select" aria-label="Periode agenda" onchange="setAgendaPeriod(this.value)" style="min-width:150px"><option value="today" ${period==='today'?'selected':''}>Hari Ini</option><option value="7" ${period==='7'?'selected':''}>7 Hari ke Depan</option><option value="month" ${period==='month'?'selected':''}>Bulan Ini</option></select><button class="btn small" onclick="go('Kalender Operasional')">Kalender →</button></div></div><div class="agenda-tabs">${btn('Agenda Penugasan','trip')}${btn('Agenda Operasional Lainnya','other')}</div><div class="agenda-meta">${selected.length} agenda ${category==='trip'?'penugasan':'koordinasi'} pada periode ini · ${category==='trip'?'Detail perjalanan dan penugasan':'Hanya kegiatan yang memerlukan keputusan Manager; jadwal servis rutin ada di Kalender'}</div><div class="agenda-items">${selected.slice(0,6).map(ev=>`<button class="agenda-item" onclick="${ev.type==='trip'?`jumpTrip('${ev.id}')`:`calendarOpen('service','${ev.id}')`}"><span class="agenda-day">${prettyDay(ev.date)}<small>${h(ev.time)}</small></span><span class="agenda-title"><b>${h(ev.title)}</b><small>${h(ev.detail)}</small></span><span class="tag ${ev.type==='trip'?'blue':'yellow'}">${ev.type==='trip'?'Penugasan':'Koordinasi'}</span></button>`).join('')||`<div class="empty">Tidak ada ${category==='trip'?'penugasan':'agenda koordinasi'} pada periode terpilih.</div>`}</div><div class="dashboard-summary-note">${moreLink}</div></section>`
}
function calEventCard(e,compact=false){return `<button class="cal-event ${e.type==='trip'?'cal-trip':serviceBadge(e.status)}" onclick="calendarOpen('${e.type}','${e.id}')" title="${h(e.title)}"><strong>${e.type==='trip'?'↗':'⚒'} ${h(e.start)} ${h(e.title)}</strong>${compact?'':`<small>${h(veh(e.v)?.plate||'')} ${e.type==='trip'?'· '+h(drv(e.d)?.name||''):''}</small>`}</button>`}
function calendarPage(){let date=state.calDate,month=localDate(date),week=weekStart(date),mode=state.calMode,events=calendarEvents(),filter=state.calFilter,conflicts=calendarConflicts();let begin,end,days=[];
if(mode==='Bulan'){let first=new Date(month.getFullYear(),month.getMonth(),1,12),offset=(first.getDay()+6)%7;first.setDate(first.getDate()-offset);begin=isoDay(first);days=Array.from({length:42},(_,i)=>addDays(begin,i));end=addDays(begin,42)}else{begin=week;days=Array.from({length:7},(_,i)=>addDays(week,i));end=addDays(week,7)}
let visible=events.filter(e=>e.date>=begin&&e.date<end&&(filter==='all'||filter===e.type));let dateTitle=mode==='Bulan'?month.toLocaleDateString('id-ID',{month:'long',year:'numeric'}):`${prettyLong(begin)} – ${prettyLong(addDays(end,-1))}`;
let controls=`<div class="cal-toolbar"><div class="actions"><button class="btn small" onclick="calMove(-1)">‹</button><button class="btn small" onclick="calToday()">Hari Ini</button><button class="btn small" onclick="calMove(1)">›</button><strong>${h(dateTitle)}</strong></div><div class="actions"><select class="select" aria-label="Jenis agenda" onchange="calSetFilter(this.value)"><option value="all" ${filter==='all'?'selected':''}>Semua Agenda</option><option value="trip" ${filter==='trip'?'selected':''}>Penugasan</option><option value="service" ${filter==='service'?'selected':''}>Perawatan</option></select>${['Minggu','Bulan','Sumber Daya'].map(m=>`<button class="btn small ${mode===m?'primary':''}" onclick="calSetMode('${m}')">${m}</button>`).join('')}</div></div>`;
let body='';
if(mode==='Sumber Daya'){let resources=state.calResource==='Kendaraan'?db.vehicles.map(v=>({id:v.id,label:v.plate,sub:v.model})):db.drivers.map(d=>({id:d.id,label:d.name,sub:d.unit}));let rows=resources.map(r=>`<tr><th class="resource-name">${h(r.label)}<small>${h(r.sub)}</small></th>${days.map(day=>{let es=visible.filter(e=>e.date===day&&(state.calResource==='Kendaraan'?e.v===r.id:e.d===r.id));return `<td>${es.map(e=>calEventCard(e,true)).join('')||'<span class="avail-label">Tersedia*</span>'}</td>`}).join('')}</tr>`).join('');body=`<div class="actions resource-control"><span class="muted">Tampilkan jadwal berdasarkan</span><select class="select" onchange="calSetResource(this.value)"><option ${state.calResource==='Kendaraan'?'selected':''}>Kendaraan</option><option ${state.calResource==='Pengemudi'?'selected':''}>Pengemudi</option></select></div><div class="table-wrap"><table class="resource-table"><thead><tr><th>${state.calResource==='Kendaraan'?'Kendaraan':'Pengemudi'}</th>${days.map(d=>`<th>${shortWeek(d)}<br>${prettyDay(d)}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div><div class="bottomnote">* Tersedia berarti tidak ada agenda tercatat pada hari tersebut, bukan jaminan kesiapan teknis maupun keselamatan.</div>`}
else{body=`<div class="cal-grid">${['Sen','Sel','Rab','Kam','Jum','Sab','Min'].map(x=>`<div class="cal-weekhead">${x}</div>`).join('')}${days.map(d=>`<div class="cal-cell ${d===isoDay(new Date())?'is-today':''} ${mode==='Bulan'&&localDate(d).getMonth()!==month.getMonth()?'other-month':''}"><button class="cal-date" onclick="calFocus('${d}')">${mode==='Bulan'?localDate(d).getDate():prettyDay(d)}</button>${visible.filter(e=>e.date===d).slice(0,mode==='Bulan'?3:12).map(e=>calEventCard(e,mode==='Bulan')).join('')}${visible.filter(e=>e.date===d).length>(mode==='Bulan'?3:12)?`<small class="muted">+${visible.filter(e=>e.date===d).length-(mode==='Bulan'?3:12)} agenda lain</small>`:''}</div>`).join('')}</div>`}
let clashPanel=panel('Perhatian Jadwal',conflicts.length?conflicts.map(c=>`<div class="statsline"><span><b>${prettyDay(c.date)} · ${h(c.reason)}</b><br><small>${h(c.a.id)} berbenturan dengan ${h(c.b.id)}</small></span><button class="btn small" onclick="calendarOpen('${c.a.type}','${c.a.id}')">Detail</button></div>`).join(''):'<div class="empty">Tidak ada benturan pada jadwal yang telah dicatat. Usulan perawatan yang belum dikonfirmasi ditampilkan terpisah sebagai agenda.</div>');
return head('Kalender Operasional','Lihat agenda mingguan, bulanan dan jadwal per kendaraan atau pengemudi.',`<button class="btn primary" onclick="openTripForm()">＋ Buat Penugasan</button>`)+`<div class="grid g3 section">${kpi('Agenda periode',visible.length,'Penugasan dan hari perawatan','▦')}${kpi('Penugasan',visible.filter(e=>e.type==='trip').length,'Pada periode ditampilkan','↗')}${kpi('Benturan tercatat',conflicts.filter(c=>c.date>=begin&&c.date<end).length,'Butuh peninjauan Manager','⚠')}</div><section class="panel section"><div class="panel-head"><h2>Kalender & Jadwal Sumber Daya</h2><span class="muted">Pilih agenda untuk melihat detail</span></div>${controls}<div class="calendar-legend"><span><i class="legend-trip"></i> Penugasan</span><span><i class="legend-maint"></i> Perawatan dikonfirmasi</span><span><i class="legend-proposal"></i> Usulan Admin</span></div>${body}</section>${clashPanel}`}
function dashboard(){
 const ongoing=db.trips.filter(t=>t.stage==='Berjalan').length;
 const ready=db.vehicles.filter(vAvailable).length;
 const eligible=db.drivers.filter(d=>dReady(d)&&!dBusy(d.id)).length;
 const alerts=db.alerts.filter(a=>a.state==='Aktif');
 const priority=panel('Prioritas Keselamatan',`<div class="dashboard-alerts">${alerts.map(a=>`<div class="dashboard-alert"><span><strong>${h(a.title)}</strong><small>${h(a.detail)}</small></span><span class="actions">${badge(a.level)}<button class="btn small" onclick="go('Safety Monitoring')">Tindak Lanjut</button></span></div>`).join('')||'<div class="empty">Tidak ada peringatan keselamatan yang memerlukan tindakan.</div>'}</div>`,`<button class="btn small" onclick="go('Safety Monitoring')">Semua Peringatan →</button>`);
 return head('Operational Dashboard','Kondisi operasional hari ini, agenda berikutnya, dan prioritas keselamatan.',`<button class="btn primary" onclick="openTripForm()">＋ Buat Penugasan</button>`)
 +`<div class="grid g4 section">${kpi('Armada siap',ready,'Tersedia untuk dialokasikan saat ini','🚙')}${kpi('Pengemudi siap',eligible,'Layak dan tidak sedang bertugas','♙')}${kpi('Perjalanan aktif',ongoing,'Sedang berlangsung','↗')}${kpi('Peringatan keselamatan',alerts.length,'Memerlukan perhatian Manager','⚠')}</div>`
 +dashboardAgenda()
 +`<div class="section">${priority}</div>`;
}
function bars(a){let max=Math.max(...a.map(x=>x.val),1);return `<div class="charts">${a.map(x=>`<div class="barcol"><b style="font-size:10px">${fmt(x.val)}</b><div class="bar" style="height:${Math.max(5,Math.round(x.val/max*118))}px"></div><small>${h(x.label)}</small></div>`).join('')}</div>`}
function assignments(){let tab=subtabs('Penugasan & Perjalanan',['Jadwal Penugasan','Menunggu Berangkat','Perjalanan Aktif','Pengembalian','Semua Penugasan']);let active=state.tab['Penugasan & Perjalanan'];let entries=db.trips.filter(t=>active==='Jadwal Penugasan'?t.stage==='Terjadwal':active==='Menunggu Berangkat'?t.stage==='Terjadwal':active==='Perjalanan Aktif'?t.stage==='Berjalan':active==='Pengembalian'?t.stage==='Menunggu Pengembalian':true);return head('Penugasan & Perjalanan','Buat penugasan langsung, tentukan kendaraan–driver, pantau Safety Gate hingga kendaraan dikembalikan.',`<button class="btn primary" onclick="openTripForm()">＋ Buat Penugasan</button>`)+`${tab}${panel('Daftar Penugasan',`<div class="table-wrap"><table><thead><tr><th>ID / Tanggal</th><th>Kendaraan</th><th>Pengemudi</th><th>Tujuan</th><th>Safety Gate</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${entries.map(t=>`<tr><td><b>${h(t.id)}</b><div class="person-sub">${h(t.date)} ${h(t.start)}–${h(t.end)}</div></td><td>${h(veh(t.v)?.model)}<div class="person-sub">${h(veh(t.v)?.plate)}</div></td><td>${h(drv(t.d)?.name)}</td><td>${h(t.destination)}</td><td>${badge(t.gate)}</td><td>${badge(t.stage)}</td><td><button class="btn small" onclick="openTrip('${t.id}')">Kelola</button></td></tr>`).join('')||'<tr><td colspan="7"><div class="empty">Belum ada penugasan pada kategori ini</div></td></tr>'}</tbody></table></div>`,`<span class="tag blue">${entries.length} penugasan</span>`)}<div class="bottomnote">Penugasan dapat dijadwalkan sebelum pre-trip selesai. Keberangkatan hanya dapat dilakukan setelah Safety Gate dinyatakan lolos.</div>`}
function openTripForm(){modal('Buat Penugasan Kendaraan Pool',`<form onsubmit="createTrip(event)"><div class="form-grid"><div class="field"><label>Kendaraan pool *</label><select class="select" name="vehicle" required>${db.vehicles.map(v=>`<option value="${v.id}">${h(v.model)} · ${h(v.plate)}${!vReady(v)?' · perlu perhatian':''}</option>`).join('')}</select></div><div class="field"><label>Pengemudi *</label><select class="select" name="driver" required>${db.drivers.map(d=>`<option value="${d.id}">${h(d.name)} · SIM ${h(d.sim)}</option>`).join('')}</select></div><div class="field"><label>Tanggal *</label><input class="input" name="date" type="date" value="2026-11-27" required></div><div class="field"><label>Waktu mulai *</label><input class="input" type="time" name="start" value="08:00" required></div><div class="field"><label>Estimasi kembali *</label><input class="input" type="time" name="end" value="16:00" required></div><div class="field"><label>Tujuan *</label><input class="input" name="destination" placeholder="Tujuan perjalanan" required></div><div class="field span2"><label>Keperluan</label><input class="input" name="purpose" placeholder="Kegiatan dinas / koordinasi" ></div><div class="field span2"><label>Referensi surat tugas / disposisi (opsional)</label><input class="input" name="doc" placeholder="Nomor surat atau dokumen pendukung"></div></div><div class="alert blue" style="margin-bottom:15px">Penugasan adalah keputusan operasional. Lampiran administratif opsional tidak menggantikan pemeriksaan keselamatan.</div><div class="actions" style="justify-content:end"><button class="btn" type="button" onclick="closeModal()">Batal</button><button class="btn primary" type="submit">Simpan Penugasan</button></div></form>`)}
function createTrip(e){e.preventDefault();let d=Object.fromEntries(new FormData(e.target)),v=veh(d.vehicle),driver=drv(d.driver);if(d.start>=d.end)return toast('Waktu kembali harus setelah keberangkatan pada hari yang sama.');if(!v||!driver)return toast('Kendaraan/pengemudi tidak ditemukan.');if(!vReady(v))return toast('Kendaraan belum memenuhi syarat dasar atau sedang dalam perawatan.');if(!driver.simValid||driver.health!=='Berlaku')return toast('Dokumen/kelayakan pengemudi belum memenuhi syarat.');if(!driver.competence.includes(v.type))return toast('Kompetensi pengemudi belum sesuai kategori kendaraan.');if(maintenanceConflict(v.id,d.date,d.start,d.end))return toast('Jadwal berbenturan dengan perawatan kendaraan. Periksa Kalender Operasional.');if(db.trips.some(t=>t.v===v.id&&dayConflict(d.date,d.start,d.end,[t]))||db.trips.some(t=>t.d===driver.id&&dayConflict(d.date,d.start,d.end,[t])))return toast('Ada benturan jadwal kendaraan atau pengemudi.');let id='TR-2026-'+String(Math.max(105,...db.trips.map(t=>parseInt(t.id.split('-').at(-1))||0))+1);db.trips.unshift({id,v:v.id,d:driver.id,date:d.date,start:d.start,end:d.end,destination:d.destination,purpose:d.purpose,doc:d.doc,stage:'Terjadwal',gate:'Belum Diperiksa',pre:false,post:false,odoStart:v.odometer,odoEnd:null,km:0});save();closeModal();toast('Penugasan tersimpan. Pre-trip dan Safety Gate masih wajib.');go('Penugasan & Perjalanan');openTrip(id)}
function openTrip(id){let t=trip(id);if(!t)return;let v=veh(t.v),d=drv(t.d);let ready=v&&d&&vReady(v)&&dReady(d)&&d.competence.includes(v.type)&&!dBusy(d.id,t.id)&&!vBusy(v.id,t.id);modal('Detail Penugasan · '+id,`<div class="grid g2"><div class="note-box"><b>Kendaraan:</b> ${h(v?.model)} · ${h(v?.plate)}<br><b>Pengemudi:</b> ${h(d?.name)} · SIM ${h(d?.sim)}<br><b>Tujuan:</b> ${h(t.destination)}<br><b>Waktu:</b> ${h(t.date)} ${h(t.start)}–${h(t.end)}</div><div class="note-box"><b>Status:</b> ${badge(t.stage)}<br><b>Safety Gate:</b> ${badge(t.gate)}<br><b>Pre-trip:</b> ${t.pre?'Sudah tercatat':'Belum'}<br><b>Surat/dokumen:</b> ${h(t.doc||'Tidak dilampirkan')}</div></div><div class="divider"></div><h3>Persyaratan perjalanan</h3><div class="statsline"><span>Kondisi kendaraan dan perangkat</span>${badge(vReady(v)?'Lolos':'Tidak Lolos')}</div><div class="statsline"><span>SIM, kompetensi dan kelayakan driver</span>${badge(dReady(d)&&d.competence.includes(v.type)?'Lolos':'Tidak Lolos')}</div><div class="statsline"><span>Aktivitas / jeda driver</span>${badge(d.rest==='Jeda kurang'?'Perlu Evaluasi':'Lolos')}</div><div class="statsline"><span>Inspeksi pre-trip</span>${badge(t.pre?'Lolos':'Belum Diperiksa')}</div><div class="divider"></div><div class="actions">${t.stage==='Terjadwal'?`<button class="btn" onclick="simulatePre('${id}')">✓ Catat Hasil Pre-trip (simulasi)</button><button class="btn" onclick="evaluateGate('${id}')">Evaluasi Safety Gate</button><button class="btn primary" ${t.gate!=='Lolos'?'disabled':''} onclick="startTrip('${id}')">Mulai Perjalanan</button>`:''}${t.stage==='Berjalan'?`<button class="btn primary" onclick="endTrip('${id}')">Akhiri Perjalanan</button>`:''}${t.stage==='Menunggu Pengembalian'?`<button class="btn primary" onclick="returnTrip('${id}')">Proses Pengembalian</button>`:''}${t.stage==='Selesai'?'<span class="tag green">Perjalanan telah selesai</span>':''}</div><p class="bottomnote">Dalam sistem nyata, hasil pre/post-trip dikirim Driver dari aplikasi mobile; tombol simulasi hanya untuk demo alur.</p>${!ready&&t.stage==='Terjadwal'?'<div class="alert red">Ada persyaratan kendaraan atau driver yang belum terpenuhi. Manager tidak dapat memaksa Safety Gate lolos.</div>':''}`)}
function simulatePre(id){let t=trip(id);if(!t||t.stage!=='Terjadwal')return;t.pre=true;save();toast('Hasil pre-trip simulasi tercatat.');openTrip(id)}function evaluateGate(id){let t=trip(id),v=veh(t.v),d=drv(t.d);if(!t||t.stage!=='Terjadwal')return;let pass=t.pre&&vReady(v)&&dReady(d)&&d.competence.includes(v.type)&&!vBusy(v.id,t.id)&&!dBusy(d.id,t.id);t.gate=pass?'Lolos':'Tidak Lolos';save();toast(pass?'Safety Gate lolos.':'Safety Gate tidak lolos; periksa persyaratan.');openTrip(id)}function startTrip(id){let t=trip(id);if(!t||t.stage!=='Terjadwal'||t.gate!=='Lolos')return toast('Safety Gate wajib lolos.');let v=veh(t.v),d=drv(t.d);if(!t.pre||!vReady(v)||!dReady(d)||!d.competence.includes(v.type)||vBusy(v.id,t.id)||dBusy(d.id,t.id)){t.gate='Tidak Lolos';save();return toast('Persyaratan berubah. Evaluasi ulang Safety Gate.')}t.stage='Berjalan';save();closeModal();toast('Perjalanan dimulai.');render()}function endTrip(id){let t=trip(id);if(!t||t.stage!=='Berjalan')return;t.stage='Menunggu Pengembalian';save();toast('Perjalanan berakhir. Menunggu post-trip.');openTrip(id)}function returnTrip(id){let t=trip(id),v=veh(t.v);modal('Pengembalian · '+id,`<form onsubmit="saveReturn(event,'${id}')"><div class="field"><label>Odometer akhir (km)</label><input class="input" type="number" min="${v.odometer}" name="odo" value="${v.odometer+55}" required></div><div class="field"><label>Hasil post-trip</label><select class="select" name="condition"><option value="baik">Tidak ada temuan</option><option value="masalah">Ada kerusakan/perlu pemeriksaan</option></select></div><div class="field"><label>Catatan temuan</label><textarea class="textarea" name="note" placeholder="Jelaskan kerusakan bila ada"></textarea></div><div class="actions" style="justify-content:end"><button class="btn" type="button" onclick="closeModal()">Batal</button><button class="btn primary" type="submit">Simpan Pengembalian</button></div></form>`)}function saveReturn(e,id){e.preventDefault();let t=trip(id),v=veh(t.v),d=Object.fromEntries(new FormData(e.target)),odo=Number(d.odo);if(odo<v.odometer)return toast('Odometer akhir tidak boleh lebih rendah daripada catatan terakhir.');t.odoEnd=odo;t.km=odo-t.odoStart;t.post=true;t.stage='Selesai';v.odometer=odo;if(d.condition==='masalah'){v.health='Perlu Pemeriksaan';let rid='RP-'+String(db.repairs.length+1).padStart(3,'0');db.repairs.unshift({id:rid,vehicle:v.id,issue:d.note||'Temuan post-trip '+id,level:'Sedang',status:'Diajukan ke Admin',ref:id,date:new Date().toISOString().slice(0,10)})}save();closeModal();toast('Pengembalian tercatat.'+(d.condition==='masalah'?' Pengajuan perbaikan otomatis dibuat.':''));render()}
function tracking(){let t=db.trips.filter(x=>x.stage==='Berjalan'),id=state.tracker;let v=veh(id);return head('Live Tracking','Pemantauan kendaraan pool melalui telemetri yang tersedia. Peta berikut ilustrasi, bukan posisi GPS aktual.',`<button class="btn" onclick="go('Safety Monitoring')">Lihat Safety Alerts</button>`)+`<div class="grid g2 section" style="grid-template-columns:1.6fr 1fr"><section class="panel"><div class="panel-head"><h2>Peta Armada Pool</h2><span class="tag blue">SIMULASI MAP</span></div><div class="map-demo"><div class="map-point" style="left:24%;top:25%">🚙 Avanza</div><div class="map-point" style="left:56%;top:54%">🚐 Hiace</div><div class="map-point" style="left:65%;top:18%">🚙 Innova</div><div class="map-caption">⚠️ Tidak menampilkan posisi real-time. Titik pada peta bersifat dekoratif, karena demo belum terhubung GPS.</div></div></section><section class="panel"><div class="panel-head"><h2>Status Kendaraan</h2></div><div class="field"><label>Pilih kendaraan</label><select class="select" onchange="state.tracker=this.value;render()">${db.vehicles.map(x=>`<option ${x.id===id?'selected':''} value="${x.id}">${h(x.model)} · ${h(x.plate)}</option>`).join('')}</select></div><div class="statsline"><span>Nomor polisi</span><span>${h(v.plate)}</span></div><div class="statsline"><span>Koneksi GPS</span>${badge(v.gps)}</div><div class="statsline"><span>Odometer terdata</span><b>${fmt(v.odometer)} km</b></div><div class="statsline"><span>Status operasional</span>${badge(vBusy(v.id)?'Berjalan':v.service?'Dalam Perawatan':'Tidak dalam perjalanan')}</div><div class="divider"></div><h3>Perjalanan aktif</h3>${t.length?t.map(x=>`<div class="statsline"><span><b>${h(veh(x.v)?.plate)}</b><br>${h(drv(x.d)?.name)}</span><button class="btn small" onclick="openTrip('${x.id}')">Detail</button></div>`).join(''):'<div class="empty">Tidak ada perjalanan aktif</div>'}</section></div>`}
function history(){let rows=db.trips.filter(t=>t.stage==='Selesai').filter(t=>(veh(t.v)?.plate+' '+drv(t.d)?.name+' '+t.destination).toLowerCase().includes(state.query.toLowerCase()));return head('Riwayat Perjalanan','Catatan perjalanan pool untuk analisis penggunaan. Histori yang selesai tidak dapat diedit ulang oleh Manager.',`<button class="btn" onclick="exportCSV('trips')">⇩ Ekspor CSV</button>`)+`<div class="toolbar"><input class="input" placeholder="Cari kendaraan, driver, atau tujuan" value="${h(state.query)}" oninput="state.query=this.value;render()"></div>`+panel('Perjalanan Selesai',`<div class="table-wrap"><table><thead><tr><th>ID / Tanggal</th><th>Kendaraan</th><th>Pengemudi</th><th>Tujuan</th><th>Jarak</th><th>Odometer</th><th>Detail</th></tr></thead><tbody>${rows.map(t=>`<tr><td>${h(t.id)}<div class="person-sub">${h(t.date)}</div></td><td>${h(veh(t.v)?.plate)}</td><td>${h(drv(t.d)?.name)}</td><td>${h(t.destination)}</td><td>${fmt(t.km)} km</td><td>${fmt(t.odoStart)} → ${fmt(t.odoEnd)}</td><td><button class="btn small" onclick="openTrip('${t.id}')">Lihat</button></td></tr>`).join('')||'<tr><td colspan="7"><div class="empty">Tidak ada perjalanan selesai</div></td></tr>'}</tbody></table></div>`)}
function readinessVehicles(){let vs=db.vehicles.filter(v=>state.vehicleFilter==='Semua'||(state.vehicleFilter==='Siap'&&vAvailable(v))||(state.vehicleFilter==='Perhatian'&&!vAvailable(v))).filter(v=>(v.plate+' '+v.model).toLowerCase().includes(state.query.toLowerCase()));return head('Kesiapan Armada','Ketersediaan dan kondisi operasional kendaraan pool. Status aset bersumber dari Admin.')+`<div class="toolbar"><input class="input" value="${h(state.query)}" oninput="state.query=this.value;render()" placeholder="Cari kendaraan / nomor polisi"><select class="select" onchange="state.vehicleFilter=this.value;render()">${['Semua','Siap','Perhatian'].map(x=>`<option ${state.vehicleFilter===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="grid g3 section">${vs.map(v=>`<section class="panel vehicle"><div class="carart"><span>${badge(vAvailable(v)?'Tersedia':v.health!=='Baik'?v.health:v.service?'Dalam Perawatan':vBusy(v.id)?'Berjalan':'Perlu Pemeriksaan')}</span><span class="caricon">${v.type==='Minibus'?'🚐':'🚙'}</span></div><div class="body"><div class="vtitle">${h(v.model)}</div><div class="muted">${h(v.plate)} · ${h(v.type)} · ${v.capacity} kursi</div><div class="statsline"><span>Odometer</span><span>${fmt(v.odometer)} km</span></div><div class="statsline"><span>Kondisi aset</span>${badge(v.health)}</div><div class="statsline"><span>GPS</span>${badge(v.gps)}</div><div class="statsline"><span>Pemakaian 7 hari</span><span>${fmt(v.km7)} km / ${v.trips7} trip</span></div><div class="actions" style="margin-top:13px"><button class="btn small" onclick="openVehicle('${v.id}')">Detail</button><button class="btn small primary" ${!vAvailable(v)?'disabled':''} onclick="openTripForm()">Tugaskan</button></div></div></section>`).join('')||'<div class="empty">Tidak ada kendaraan</div>'}</div>`}function openVehicle(id){let v=veh(id);modal('Ringkasan Armada · '+v.plate,`<div class="note-box"><b>${h(v.model)}</b><br>Jenis: ${h(v.type)} · ${v.capacity} kursi<br>Kondisi aset: ${h(v.health)}<br>Odometer: ${fmt(v.odometer)} km<br>GPS: ${h(v.gps)}<br>7 hari: ${fmt(v.km7)} km · ${v.trips7} perjalanan</div><div class="alert blue" style="margin-top:14px">Detail servis, dokumen asli, dan penggantian komponen dikelola Admin. Manager hanya melihat status yang relevan untuk operasi.</div>`)}
function readinessDrivers(){let tab=subtabs('Kesiapan Pengemudi',['Daftar Pengemudi','Driver Workload','Kecocokan Driver–Kendaraan']);let selected=state.tab['Kesiapan Pengemudi'];let body='';if(selected==='Daftar Pengemudi')body=`<div class="grid g3">${db.drivers.map(d=>`<section class="panel"><div class="person"><div class="pic">${h(d.name.split(' ').map(x=>x[0]).join(''))}</div><div><div class="person-name">${h(d.name)}</div><div class="person-sub">${h(d.unit)} · SIM ${h(d.sim)}</div></div></div><div class="divider"></div><div class="statsline"><span>Kelayakan tugas</span>${badge(d.health)}</div><div class="statsline"><span>Kompetensi</span><b>${h(d.competence.join(', '))}</b></div><div class="statsline"><span>Jam mengemudi / 7 hari</span><b>${d.hours7.toFixed(1).replace('.',',')} jam</b></div><div class="statsline"><span>Jeda istirahat</span>${badge(d.rest)}</div><div class="statsline"><span>Siap memenuhi syarat dasar</span>${badge(dReady(d)?'Lolos':'Perlu Evaluasi')}</div><button class="btn small" style="margin-top:12px" onclick="openDriver('${d.id}')">Lihat Profil Operasional</button></section>`).join('')}</div>`;else if(selected==='Driver Workload')body=panel('Aktivitas Pengemudi (7 hari)',`<div class="table-wrap"><table><thead><tr><th>Pengemudi</th><th>Jam</th><th>Jarak</th><th>Jeda tercatat</th><th>Indikasi</th></tr></thead><tbody>${db.drivers.map(d=>`<tr><td><b>${h(d.name)}</b></td><td>${d.hours7.toFixed(1)} jam</td><td>${fmt(d.km7)} km</td><td>${h(d.rest)}</td><td>${badge(d.rest==='Jeda kurang'?'Perlu Evaluasi':d.hours7>23?'Perhatian':'Terpantau')}</td></tr>`).join('')}</tbody></table></div><p class="bottomnote">Data jam, kilometer, dan jeda adalah indikator. Tidak digunakan sebagai diagnosis medis. Evaluasi penugasan dilakukan Manager berdasarkan SOP dan kondisi aktual.</p>`);else {let v=veh(state.compat);let candidates=db.drivers.map(d=>({d,eligible:d.simValid&&d.health==='Berlaku'&&d.competence.includes(v.type),experience:d.fav.includes(v.id)?'Terbiasa dengan kendaraan':'Kompetensi jenis kendaraan',occupied:dBusy(d.id)})).sort((a,b)=>Number(b.eligible)-Number(a.eligible)||Number(b.d.fav.includes(v.id))-Number(a.d.fav.includes(v.id)));body=`<div class="field" style="max-width:350px"><label>Pilih kendaraan yang membutuhkan pengemudi</label><select class="select" onchange="state.compat=this.value;render()">${db.vehicles.map(x=>`<option value="${x.id}" ${state.compat===x.id?'selected':''}>${h(x.model)} · ${h(x.plate)}</option>`).join('')}</select></div>${panel('Kandidat untuk '+v.model,`<div class="table-wrap"><table><thead><tr><th>Driver</th><th>SIM</th><th>Kompetensi</th><th>Pengalaman</th><th>Kelayakan awal</th></tr></thead><tbody>${candidates.map(({d,eligible,experience,occupied})=>`<tr><td><b>${h(d.name)}</b></td><td>${h(d.sim)} ${d.simValid?'':'(tidak valid)'}</td><td>${h(d.competence.join(', '))}</td><td>${h(experience)}<div class="person-sub">${d.trips} trip historis (demo)</div></td><td>${badge(!eligible?'Tidak Lolos':occupied?'Sedang bertugas':d.rest==='Jeda kurang'?'Perlu Evaluasi':'Kandidat')}</td></tr>`).join('')}</tbody></table></div><p class="bottomnote">Kandidat disaring berdasarkan profil SIM dan kompetensi tersimpan. Kesesuaian legal akhir mengikuti dokumen kendaraan yang sesungguhnya, kelas SIM, dan aturan berlaku. Pengalaman tidak menggantikan persyaratan wajib.</p>`)}`;}return head('Kesiapan Pengemudi','Profil operasional, aktivitas mengemudi dan rekomendasi kandidat untuk kendaraan pool.')+tab+body}function openDriver(id){let d=drv(id);modal('Profil Operasional · '+d.name,`<div class="person"><div class="pic" style="width:60px;height:60px;font-size:19px">${h(d.name.split(' ').map(x=>x[0]).join(''))}</div><div><b>${h(d.name)}</b><div class="person-sub">${h(d.id)} · ${h(d.unit)}</div></div></div><div class="divider"></div><div class="statsline"><span>SIM</span><b>${h(d.sim)} · ${d.simValid?'Valid':'Tidak valid'}</b></div><div class="statsline"><span>Kelayakan tugas</span>${badge(d.health)}</div><div class="statsline"><span>Kompetensi</span><b>${h(d.competence.join(', '))}</b></div><div class="statsline"><span>Jam / jarak 7 hari</span><b>${d.hours7} jam · ${fmt(d.km7)} km</b></div><div class="statsline"><span>Jeda</span>${badge(d.rest)}</div><div class="alert blue" style="margin-top:12px">KTP, NIK, hasil laboratorium dan diagnosis kesehatan tidak ditampilkan pada role Manager.</div>`)}
function safety(){let active=db.alerts.filter(a=>a.state==='Aktif').length;let gateFailed=db.trips.filter(t=>t.gate==='Tidak Lolos').length;return head('Safety Monitoring','Pantau Safety Gate, hasil inspeksi, sinyal potensi kelelahan, dan tindak lanjut keselamatan.')+`<div class="grid g3 section">${kpi('Peringatan aktif',active,'Perlu respons operasional','⚠')}${kpi('Safety Gate gagal',gateFailed,'Keberangkatan otomatis diblokir','⬡')}${kpi('Pre-trip tercatat',db.trips.filter(t=>t.pre).length,'Dari '+db.trips.length+' penugasan','☑')}</div>${subtabs('Safety Monitoring',['Safety Alerts','Safety Gate','Checklist Perjalanan'])}${state.tab['Safety Monitoring']==='Safety Alerts'?panel('Daftar Peringatan',`<div class="table-wrap"><table><thead><tr><th>Prioritas</th><th>Temuan</th><th>Kategori</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${db.alerts.map(a=>`<tr><td>${badge(a.level)}</td><td><b>${h(a.title)}</b><div class="person-sub">${h(a.detail)}</div></td><td>${h(a.type)}</td><td>${badge(a.state)}</td><td>${a.state==='Aktif'?`<button class="btn small" onclick="respondAlert('${a.id}')">Catat Respons</button>`:'<span class="tag">Tercatat</span>'}</td></tr>`).join('')}</tbody></table></div><p class="bottomnote">Catat respons Manager; catatan sumber tidak dihapus, dan temuan kritis tidak otomatis dinyatakan selesai secara teknis.</p>`):state.tab['Safety Monitoring']==='Safety Gate'?panel('Safety Gate Penugasan',`<div class="table-wrap"><table><thead><tr><th>Penugasan</th><th>Driver</th><th>Pre-trip</th><th>Safety Gate</th><th>Detail</th></tr></thead><tbody>${db.trips.map(t=>`<tr><td>${h(t.id)}</td><td>${h(drv(t.d)?.name)}</td><td>${t.pre?'Lengkap':'Belum'}</td><td>${badge(t.gate)}</td><td><button class="btn small" onclick="openTrip('${t.id}')">Periksa</button></td></tr>`).join('')}</tbody></table></div>`):panel('Hasil Checklist',`<div class="table-wrap"><table><thead><tr><th>Penugasan</th><th>Pre-trip</th><th>Post-trip</th><th>Kondisi aset</th></tr></thead><tbody>${db.trips.map(t=>`<tr><td>${h(t.id)}</td><td>${t.pre?'✓':'Belum'}</td><td>${t.post?'✓':'Belum'}</td><td>${badge(veh(t.v)?.health)}</td></tr>`).join('')}</tbody></table></div><p class="bottomnote">Checklist berasal dari aplikasi Driver. Manager melakukan pemantauan dan eskalasi, bukan mengubah bukti inspeksi asli.</p>`)}`}
function respondAlert(id){let a=db.alerts.find(x=>x.id===id);modal('Catat Respons · '+id,`<form onsubmit="saveAlertResponse(event,'${id}')"><div class="note-box">${h(a.title)}<br>${h(a.detail)}</div><div class="field" style="margin-top:14px"><label>Tindakan operasional</label><select class="select" name="action"><option>Koordinasikan pemeriksaan</option><option>Tunda / ubah penugasan</option><option>Hubungi driver dan minta istirahat</option><option>Eskalasi ke Admin</option><option>Monitor lanjutan</option></select></div><div class="field"><label>Catatan respons</label><textarea class="textarea" name="note" required placeholder="Jelaskan tindak lanjut"></textarea></div><button class="btn primary" type="submit">Catat Respons</button></form>`)}function saveAlertResponse(e,id){e.preventDefault();let a=db.alerts.find(x=>x.id===id),d=Object.fromEntries(new FormData(e.target));a.state='Ditindaklanjuti';a.response=d.action+' — '+d.note;db.notes.unshift({type:'safety',ref:id,content:a.response,date:new Date().toISOString()});save();closeModal();toast('Respons dicatat; kondisi teknis tidak otomatis dipulihkan.');render()}
function maintenance(){let tab=subtabs('Koordinasi Perawatan',['Usulan & Jadwal','Status Perawatan','Riwayat Koordinasi']);let s=state.tab['Koordinasi Perawatan'];let rows=db.maintenance.filter(x=>s==='Usulan & Jadwal'?x.status!=='Selesai':s==='Status Perawatan'?['Dikonfirmasi','Dalam Perawatan'].includes(x.status):true);return head('Koordinasi Perawatan','Manager mengonfirmasi jendela ketersediaan armada pool. Work order, komponen, dan invoice tetap dikelola Admin.')+tab+panel('Kebutuhan Perawatan',`<div class="table-wrap"><table><thead><tr><th>Kendaraan</th><th>Kebutuhan</th><th>Usulan Admin</th><th>Durasi</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${rows.map(m=>`<tr><td><b>${h(veh(m.v)?.model)}</b><div class="person-sub">${h(veh(m.v)?.plate)}</div></td><td>${h(m.desc)}</td><td>${h(m.proposal)}</td><td>${m.duration} hari</td><td>${badge(m.status)}</td><td><button class="btn small" onclick="maintenanceAction('${m.id}')">Koordinasi</button></td></tr>`).join('')||'<tr><td colspan="6"><div class="empty">Tidak ada item</div></td></tr>'}</tbody></table></div><div class="alert blue" style="margin-top:12px">Servis biasa dapat dikoordinasikan berdasarkan jadwal; kerusakan kritis tidak boleh ditunda demi menjaga ketersediaan armada.</div>`)}function maintenanceAction(id){let m=db.maintenance.find(x=>x.id===id);modal('Koordinasi Perawatan · '+id,`<div class="note-box"><b>${h(veh(m.v)?.model)}</b> · ${h(m.desc)}<br>Tanggal usulan: ${h(m.proposal)} · Estimasi ${m.duration} hari</div><div class="divider"></div><form onsubmit="saveMaintenance(event,'${id}')"><div class="field"><label>Keputusan ketersediaan operasional</label><select class="select" name="status"><option value="Dikonfirmasi">Jendela perawatan dikonfirmasi</option><option value="Menunggu koordinasi">Perlu koordinasi ulang</option></select></div><div class="field"><label>Usulan tanggal</label><input class="input" type="date" value="${h(m.proposal)}" name="date" required></div><div class="field"><label>Catatan ke Admin</label><textarea class="textarea" name="note" placeholder="Kendaraan pengganti, jadwal berbenturan, dll"></textarea></div><button class="btn primary">Simpan Koordinasi</button></form>`)}function saveMaintenance(e,id){e.preventDefault();let m=db.maintenance.find(x=>x.id===id),d=Object.fromEntries(new FormData(e.target));m.status=d.status;m.proposal=d.date;m.note=d.note;db.notes.unshift({type:'maintenance',ref:id,content:d.status+' '+d.note,date:new Date().toISOString()});save();closeModal();toast('Koordinasi tersimpan. Pekerjaan servis tetap dikelola Admin.');render()}
function repairs(){let tab=subtabs('Pengajuan Perbaikan Armada',['Semua Pengajuan','Menunggu Admin','Tindak Lanjut']);let s=state.tab['Pengajuan Perbaikan Armada'];let rows=db.repairs.filter(r=>s==='Menunggu Admin'?r.status.includes('Admin'):true);return head('Pengajuan Perbaikan Armada','Ajukan kerusakan dari temuan perjalanan atau inspeksi. Admin mengelola pekerjaan bengkel.',`<button class="btn primary" onclick="openRepairForm()">＋ Ajukan Perbaikan</button>`)+tab+panel('Daftar Pengajuan',`<div class="table-wrap"><table><thead><tr><th>Referensi</th><th>Kendaraan</th><th>Permasalahan</th><th>Prioritas</th><th>Status</th><th>Sumber</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${h(r.id)}</b><div class="person-sub">${h(r.date)}</div></td><td>${h(veh(r.vehicle)?.plate)}</td><td>${h(r.issue)}</td><td>${badge(r.level)}</td><td>${badge(r.status)}</td><td>${h(r.ref||'Manual')}</td></tr>`).join('')||'<tr><td colspan="6"><div class="empty">Belum ada pengajuan</div></td></tr>'}</tbody></table></div><p class="bottomnote">Pengajuan adalah eskalasi operasional, bukan verifikasi hasil teknis. Data pekerjaan servis dan komponen berasal dari modul Admin.</p>`)}function openRepairForm(){modal('Ajukan Perbaikan Armada',`<form onsubmit="createRepair(event)"><div class="field"><label>Kendaraan *</label><select class="select" name="vehicle" required>${db.vehicles.map(v=>`<option value="${v.id}">${h(v.model)} · ${h(v.plate)}</option>`).join('')}</select></div><div class="field"><label>Sumber temuan</label><select class="select" name="ref"><option value="Manual">Observasi operasional</option>${db.trips.map(t=>`<option value="${h(t.id)}">${h(t.id)} · ${h(veh(t.v)?.plate)}</option>`).join('')}</select></div><div class="field"><label>Urgensi</label><select class="select" name="level"><option>Sedang</option><option>Tinggi</option><option>Kritis</option></select></div><div class="field"><label>Deskripsi kerusakan *</label><textarea class="textarea" name="issue" required placeholder="Apa yang ditemukan?"></textarea></div><button class="btn primary">Kirim ke Admin</button></form>`)}function createRepair(e){e.preventDefault();let d=Object.fromEntries(new FormData(e.target));let id='RP-'+String(db.repairs.length+1).padStart(3,'0');db.repairs.unshift({id,vehicle:d.vehicle,issue:d.issue,level:d.level,status:'Diajukan ke Admin',ref:d.ref,date:new Date().toISOString().slice(0,10)});if(d.level==='Kritis')veh(d.vehicle).health='Tidak Layak';save();closeModal();toast('Pengajuan perbaikan dikirim ke antrean Admin.'+(d.level==='Kritis'?' Kendaraan ditandai tidak layak.':''));render()}
function reports(){let stats=[['Total Penugasan',db.trips.length],['Perjalanan Selesai',db.trips.filter(t=>t.stage==='Selesai').length],['Jarak Tercatat',fmt(db.trips.reduce((s,t)=>s+(t.km||0),0))+' km'],['Pengajuan Perbaikan',db.repairs.length]];return head('Laporan Operasional','Ringkasan penugasan pool, penggunaan armada, aktivitas pengemudi, dan keselamatan.',`<button class="btn primary" onclick="exportCSV('trips')">⇩ Ekspor Perjalanan</button><button class="btn" onclick="exportCSV('alerts')">⇩ Ekspor Peringatan</button>`)+`<div class="grid g4 section">${stats.map((x,i)=>kpi(x[0],x[1],'Data simulasi', ['▣','☑','↗','⚒'][i])).join('')}</div><div class="grid g2 section">${panel('Ringkasan Kendaraan',bars(db.vehicles.map(v=>({label:v.model.split(' ').slice(-1)[0],val:v.km7}))))}${panel('Ringkasan Aktivitas Driver',bars(db.drivers.map(d=>({label:d.name.split(' ')[0],val:d.hours7}))))}</div>${panel('Ringkasan Keselamatan',`<div class="grid g3">${[['Peringatan tercatat',db.alerts.length],['Peringatan aktif',db.alerts.filter(a=>a.state==='Aktif').length],['Safety Gate gagal',db.trips.filter(t=>t.gate==='Tidak Lolos').length]].map(x=>`<div class="note-box"><div class="muted">${x[0]}</div><div style="font-size:24px;font-weight:800;color:#22364d">${x[1]}</div></div>`).join('')}</div><div class="bottomnote">Laporan Manager tidak mengubah histori asli dan tidak menggantikan pemeriksaan kepatuhan oleh Audit.</div>`)}`}
function modal(title,content){document.getElementById('modal-root').innerHTML=`<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true"><header><h2>${h(title)}</h2><button class="btn small" onclick="closeModal()">✕ Tutup</button></header>${content}</div></div>`}function closeModal(){document.getElementById('modal-root').innerHTML='';render()}
function exportCSV(type){let rows;if(type==='alerts')rows=[['ID','Prioritas','Kategori','Temuan','Status'],...db.alerts.map(a=>[a.id,a.level,a.type,a.title,a.state])];else rows=[['ID','Tanggal','Mulai','Kembali','Plat','Model','Driver','Tujuan','Status','Gate','KM'],...db.trips.map(t=>[t.id,t.date,t.start,t.end,veh(t.v)?.plate,veh(t.v)?.model,drv(t.d)?.name,t.destination,t.stage,t.gate,t.km])];let csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');let blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='fleettrack_manager_'+type+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);toast('Laporan CSV dibuat.')}function resetDemo(){if(confirm('Kembalikan seluruh data simulasi seperti semula?')){db=structuredClone(initial);save();closeModal();toast('Data demo dikembalikan.')}}
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.querySelector('.modal-back'))closeModal()});render();
</script></body></html>
