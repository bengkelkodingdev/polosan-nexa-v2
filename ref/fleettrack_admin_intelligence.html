function reportsPage(){const total=db.costs.reduce((a,x)=>a+Number(x.amount||0),0),expense={};db.costs.forEach(x=>expense[x.type]=(expense[x.type]||0)+Number(x.amount||0));const e=Object.entries(expense);return head('Laporan Aset','Analitik portofolio, pemeliharaan, legalitas, biaya serta sumber daya driver.',btn('Ekspor data kendaraan','export','vehicles','primary'))+cardsMetric([['Aset terdaftar',db.vehicles.length,'Pool + melekat'],['Total pengeluaran',money(total),'Transaksi dummy'],['Pekerjaan belum selesai',db.workorders.filter(x=>x.status!=='Selesai').length,'Work order'],['Dokumen jatuh tempo',db.documents.filter(x=>x.status!=='Aktif').length,'Perlu pembaruan']])+'<div class="twocol">'+panel('Biaya menurut kategori',e.map(([n,v])=>'<div style="margin:12px 0"><div class="keyrow"><span>'+esc(n)+'</span><strong>'+money(v)+'</strong></div><div class="fauxbar"><span style="width:'+Math.max(2,v/Math.max(...e.map(x=>x[1]))*100)+'%"></span></div></div>').join(''))+panel('Kondisi armada',list([['Baik',db.vehicles.filter(x=>x.condition==='Baik').length+' kendaraan',pill('Baik')],['Perlu pemeriksaan',db.vehicles.filter(x=>x.condition==='Perlu Pemeriksaan').length+' kendaraan',pill('Perlu Pemeriksaan')],['Tidak layak',db.vehicles.filter(x=>x.condition==='Tidak Layak').length+' kendaraan',pill('Tidak Layak')]]))+'</div>'+panel('Cakupan laporan','<div class="flow"><div>Inventaris & Dokumen</div><div>Perawatan & Servis</div><div>Biaya & Komponen</div><div>Siklus Hidup Aset</div></div><p class="footnote">Analisis perjalanan hanya untuk pool dan berada pada ruang kerja Manajer Operasional.</p>')}
function render(){nav();$('#breadcrumb').textContent='FleetTrack / Admin / '+(page==='vehicleDetail'?'Detail Kendaraan':labels[page]);$('#view').innerHTML=page==='dashboard'?dashboard():page==='planner'?plannerPage():page==='compatibility'?compatibilityPage():page==='vehicles'?vehiclePage():page==='vehicleDetail'?detailVehicle():page==='reports'?reportsPage():genericPage(page)}
function options(field,current){const [key,label,type]=field;if(type==='vehicle'||type==='vehiclePool')return (type==='vehiclePool'?db.vehicles.filter(x=>x.category==='Pool'):db.vehicles).map(v=>'<option value="'+esc(v.id)+'" '+(current===v.id?'selected':'')+'>'+esc(carLabel(v.id))+'</option>').join('');if(type.startsWith('select:'))return type.slice(7).split('|').map(x=>'<option value="'+esc(x)+'" '+(current===x?'selected':'')+'>'+esc(x)+'</option>').join('');return ''}
function formFields(p,record={}){return schemas[p].fields.map(field=>{let [key,label,type,required]=field;const val=record[key]??'',id='form-'+key;if(type.startsWith('select:')||type==='vehicle'||type==='vehiclePool')return '<div class="field"><label for="'+id+'">'+label+(required?' *':'')+'</label><select class="select" id="'+id+'" name="'+key+'">'+options(field,val)+'</select></div>';return '<div class="field"><label for="'+id+'">'+label+(required?' *':'')+'</label><input class="input" id="'+id+'" name="'+key+'" '+(required?'required ':'')+'type="'+type+'" '+(type==='number'?'min="0" ':'')+'value="'+esc(val)+'" placeholder="'+esc(label)+'"></div>'}).join('')}
function openModal(title,body,buttons=''){const host=$('#modal-host');host.innerHTML='<div class="modal-wrap" id="modalWrap"><div class="modal" role="dialog" aria-modal="true" aria-label="'+esc(title)+'"><div class="modal-header"><h2>'+esc(title)+'</h2><button class="btn icononly" data-action="closeModal" aria-label="Tutup">✕</button></div><div class="modal-body">'+body+'</div><div class="modal-actions">'+(buttons||'<button class="btn" data-action="closeModal">Tutup</button>')+'</div></div></div>';host.querySelector('input,select,button')?.focus()}
function closeModal(){$('#modal-host').innerHTML=''}
function editForm(p,id='',prevehicle=''){let r=(dataset(p).find(x=>x.id===id)||{});if(prevehicle&&!r.vehicle)r={...r,vehicle:prevehicle};let title=(id?'Edit ':'Tambah ')+schemas[p].title;let extra='';if(p==='vehicles'){extra='<div class="note" style="margin:0 0 16px"><strong>Kategori aset menentukan akses fitur.</strong> Pool dapat ditautkan perangkat GPS dan dipakai dalam penugasan. Melekat hanya administrasi aset, tanpa pelacakan perjalanan. Status kesiapan tidak bisa ditetapkan dari form master.</div><div class="field" style="margin:12px 0"><label>Foto kendaraan (JPG/PNG, opsional)</label><input type="file" accept="image/png,image/jpeg,image/webp" id="vehiclePhoto" class="input"><span class="formhint">Foto akan disimpan secara lokal di browser sebagai data demo. Ukuran maksimum dianjurkan 400 KB.</span></div>'}if(p==='workorders')extra='<div class="note">Penyelesaian pekerjaan perbaikan tidak otomatis menghapus temuan keselamatan kritis. Verifikasi teknis membutuhkan bukti dan wewenang terpisah.</div>';if(p==='drivers')extra='<div class="note">Simpan hanya informasi kelayakan kerja yang relevan. Rincian medis pribadi tidak ditampilkan dalam ruang kerja Admin umum.</div>';
openModal(title,'<form id="recordForm" data-dataset="'+p+'" data-record="'+esc(id)+'" autocomplete="off"><div class="formgrid">'+formFields(p,r)+'</div>'+extra+'</form>','<button class="btn" data-action="closeModal">Batal</button><button class="btn primary" data-action="saveRecord">'+(id?'Simpan Perubahan':'Tambah Data')+'</button>')}
function recordModal(p,id){const r=dataset(p).find(x=>x.id===id);if(!r)return;const rows=schemas[p].fields.map(f=>'<div class="keyrow" style="padding:8px 0;border-bottom:1px solid #eef1f5"><span class="key">'+esc(f[1])+'</span><strong>'+renderRecord(p,r,f)+'</strong></div>').join('');openModal('Detail '+schemas[p].title,'<div>'+rows+'</div>','<button class="btn" data-action="closeModal">Tutup</button><button class="btn primary" data-action="edit" data-id="'+p+':'+id+'">Edit Data</button>')}
function newId(p){let prefix={vehicles:'V',drivers:'D',devices:'GPS-',documents:'DOC',placements:'PLC',odometers:'ODO',schedules:'SCH',workorders:'WO-',services:'SRV',components:'CMP',costs:'COST',warranties:'WAR',procurement:'PROC',lifecycle:'LIFE',checklists:'CHK',users:'USR',references:'REF'}[p]||'ID';let i=db[p].length+1;let id;do{id=prefix+String(i++).padStart(3,'0')}while(db[p].some(x=>x.id===id));return id}
function applyEffects(p,record,old){if(p==='vehicles'){record.category=record.category||'Pool';if(!old){record.condition='Perlu Pemeriksaan';record.finding='Data awal menunggu verifikasi';record.color='#8b9cb2';record.photo=record.photo||'';record.weekly=record.category==='Pool'?0:null;record.km7=record.category==='Pool'?0:null;record.device='';record.created=new Date().toISOString().slice(0,10)}if(record.category==='Melekat'){record.weekly=null;record.km7=null;record.device=''}else if(old?.category==='Melekat'){record.weekly=0;record.km7=0}record.year=Number(record.year||0);record.odo=Number(record.odo||0);record.nextOdo=Number(record.nextOdo||0);}
if(p==='odometers'){record.value=Number(record.value||0);const v=car(record.vehicle);if(v&&(!old||record.value!==old.value)){if(record.value<v.odo){toast('Odometer menurun. Catatan disimpan sebagai data historis; odometer utama tidak diturunkan.')}else{v.odo=record.value;v.odoDate=record.date;v.odoSource=record.source}}}
if(p==='devices'){const v=car(record.vehicle);if(v&&v.category!=='Pool')throw new Error('Perangkat GPS hanya dapat ditautkan pada kendaraan pool.');if(old?.vehicle&&old.vehicle!==record.vehicle){const prev=car(old.vehicle);if(prev&&prev.device===old.id)prev.device=''}if(v&&record.status==='Terpasang')v.device=record.id;}
if(p==='services'){record.odo=Number(record.odo||0);record.cost=Number(record.cost||0);record.verified=old?.verified||false;if(record.cost>0&&!old){db.costs.push({id:newId('costs'),vehicle:record.vehicle,date:record.date,type:'Servis',amount:record.cost,description:record.detail})}const v=car(record.vehicle);if(v&&record.verified===true&&(!v.lastService||record.date>v.lastService))v.lastService=record.date;}
if(p==='costs'||p==='components'||p==='procurement'){const field=p==='costs'?'amount':p==='components'?'cost':'amount';record[field]=Number(record[field]||0)}
if(p==='workorders'){record.verified=old?.verified||false;const v=car(record.vehicle);if(v&&record.priority==='Kritis'&&record.status!=='Selesai'){v.condition='Tidak Layak';v.finding=record.issue}}
if(p==='lifecycle'&&!old){const v=car(record.vehicle);if(v&&record.status==='Tercatat'){if(record.type==='Penetapan pool'){v.category='Pool';v.weekly=0;v.km7=0}if(record.type==='Penetapan melekat'){v.category='Melekat';v.weekly=null;v.km7=null;v.device=''}}}
}
async function saveRecord(){const f=$('#recordForm');if(!f)return;const p=f.dataset.dataset,id=f.dataset.record,original=id?dataset(p).find(x=>x.id===id):null;const record={...(original||{}),id:id||newId(p)};for(const item of schemas[p].fields){let [key,label,type,required]=item;const el=f.elements.namedItem(key);let value=el?el.value.trim():'';if(required&&!value){toast('Kolom wajib belum diisi: '+label);el?.focus();return}record[key]=type==='number'?Number(value||0):value}try{applyEffects(p,record,original?{...original}:null)}catch(e){toast(e.message);return}
const photo=$('#vehiclePhoto')?.files?.[0];if(p==='vehicles'&&photo){if(photo.size>600000){toast('Foto terlalu besar untuk demo lokal (maksimal 600 KB).');return}if(!['image/png','image/jpeg','image/webp'].includes(photo.type)){toast('Gunakan JPG, PNG, atau WebP.');return}const fr=new FileReader();fr.onload=()=>{record.photo=fr.result;commitRecord(p,record,id)};fr.readAsDataURL(photo)}else commitRecord(p,record,id)}
function commitRecord(p,r,id){if(id){db[p]=db[p].map(x=>x.id===id?r:x)}else db[p].unshift(r);log((id?'Ubah ':'Tambah ')+schemas[p].title+': '+r.id);closeModal();render();toast('Data demo berhasil '+(id?'diperbarui':'ditambahkan')+'.')}
function removeRecord(p,id){const r=dataset(p).find(x=>x.id===id);if(!r)return;if(p==='vehicles'){toast('Aset dengan riwayat tidak dihapus langsung. Gunakan Mutasi & Penghapusan untuk pencatatan lifecycle.');return}if(!confirm('Hapus catatan '+id+' dari data demo?'))return;db[p]=db[p].filter(x=>x.id!==id);log('Hapus '+labels[p]+': '+id);render();toast('Catatan demo dihapus.')}
function exportCSV(p){const arr=dataset(p),sc=schemas[p],keys=sc?sc.fields.map(x=>x[0]):Object.keys(arr[0]||{});const lines=[[...keys],...arr.map(r=>keys.map(k=>String(r[k]??'')))];const csv='\ufeff'+lines.map(row=>row.map(v=>'"'+v.replace(/"/g,'""')+'"').join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const u=URL.createObjectURL(blob);const anchor=document.createElement('a');anchor.href=u;anchor.download='fleettrack-'+p+'-demo.csv';document.body.appendChild(anchor);anchor.click();anchor.remove();setTimeout(()=>URL.revokeObjectURL(u),500);toast('Ekspor CSV berhasil.')}
function resetDemo(){if(!confirm('Reset semua perubahan data demo ke kondisi awal?'))return;db=JSON.parse(JSON.stringify(initial));localStorage.removeItem('fleettrack_admin_v1');route('dashboard');toast('Data demo direset.')}
function setupInteractions(){document.addEventListener('click',e=>{const btn=e.target.closest('button');if(!btn)return;if(btn.dataset.page){route(btn.dataset.page);return}if(btn.dataset.detailtab){detailTab=btn.dataset.detailtab;render();return}const a=btn.dataset.action,id=btn.dataset.id||'';if(!a)return;
if(a==='goto'){route(id);return}if(a==='plannerSlot'){const parts=id.split('|'),v=parts[0],date=parts[1];if(db.planner[v]===date){delete db.planner[v];save();render();toast('Usulan servis dibatalkan.');return}if(plannerCount(date)>=plannerLimit){toast('Kapasitas servis hari tersebut sudah penuh. Pilih tanggal lain atau ubah batas.');return}db.planner[v]=date;save();render();toast('Usulan jadwal servis diperbarui.');return}if(a==='detailVehicle'){page='vehicleDetail';detailId=id;detailTab='overview';render();window.scrollTo(0,0);return}if(a==='displayCards'){viewMode='cards';render();return}if(a==='displayTable'){viewMode='table';render();return}if(a==='add'){editForm(id==='service'?'services':id);return}if(a==='addForVehicle'){const [p,v]=id.split(':');editForm(p,'',v);return}if(a==='edit'){const [p,r]=id.split(':');closeModal();editForm(p,r);return}if(a==='recordDetail'){const [p,r]=id.split(':');recordModal(p,r);return}if(a==='remove'){const [p,r]=id.split(':');removeRecord(p,r);return}if(a==='saveRecord'){saveRecord();return}if(a==='closeModal'){closeModal();return}if(a==='export'){exportCSV(id);return}if(a==='resetDemo'){resetDemo();return}
});document.addEventListener('input',e=>{if(e.target.id==='main-search'){const pos=e.target.selectionStart;search=e.target.value;render();const field=$('#main-search');field?.focus();try{field?.setSelectionRange(pos,pos)}catch(_){} }if(e.target.id==='side-search')nav()});document.addEventListener('change',e=>{if(e.target.id==='main-filter'){filter=e.target.value;render()}if(e.target.id==='pair-vehicle'){selectedPair=e.target.value;render()}if(e.target.id==='planner-limit'){plannerLimit=Number(e.target.value);render()}});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});$('#menuToggle').addEventListener('click',()=>$('#sidebar').classList.toggle('open'));$('#modal-host').addEventListener('click',e=>{if(e.target.id==='modalWrap')closeModal()})}
setupInteractions();render();
})();
</script></body></html>
